<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meridian - Agentic Ops Orchestrator</title>
<!--
  Landing page linking to the two separate frontends: the
  customer-facing request page and the internal Meridian ops
  dashboard. Kept separate rather than linked from within the
  customer page itself, since a real customer would never see a
  link to staff tooling.
-->
<style>
  body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f4f7fb url('assets/landing-background.png') center center / cover no-repeat;
  color: #1a1a2e;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  }
  .wrap { text-align: center; max-width: 480px; padding: 20px; }
  .logo { font-weight: 700; font-size: 20px; margin-bottom: 30px; }
  h1 { font-size: 26px; margin-bottom: 8px; }
  p { color: #6b7080; margin-bottom: 32px; }
  .choices { display: flex; gap: 16px; }
  a.choice {
    flex: 1;
    text-decoration: none;
    color: inherit;
    background: white;
    border: 1px solid #e2e5ec;
    border-radius: 12px;
    padding: 24px 16px;
    transition: border-color 0.2s ease;
  }
  a.choice:hover { border-color: #2563eb; }
  a.choice .title { font-weight: 600; margin-bottom: 4px; }
  a.choice .desc { font-size: 13px; color: #6b7080; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Meridian</div>
    <h1>Agentic Ops Orchestrator</h1>
    <p>An agentic system that reads customer requests and decides what action to take, with human oversight on anything sensitive.</p>
    <div class="choices">
      <a class="choice" href="/customer">
        <div class="title">I'm a customer</div>
        <div class="desc">Submit a request</div>
      </a>
      <a class="choice" href="/dashboard">
        <div class="title">Meridian staff</div>
        <div class="desc">Review pending requests</div>
      </a>
    </div>
  </div>
</body>
</html>
